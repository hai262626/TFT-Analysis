      - name: champion_ability
      - name: champion_ability_description
      - name: patch_version
        data_tests:
          - not_null
      - name: dbt_valid_from
        data_tests:
          - not_null
      - name: dbt_valid_to
        data_tests:
          - not_null
      - name: ingested_at
        data_tests:
          - not_null
      - name: loaded_at
        data_tests:
