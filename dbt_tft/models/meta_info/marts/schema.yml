version: 2

models:
  - name: dim_18_augments
    description: "SCD2 augment dimension enriched with patch and surrogate keys."
    columns:
      - name: augment_version_sk
        data_tests:
          - not_null
          - unique
      - name: augment_sk
        data_tests:
          - not_null
      - name: augment_id
        data_tests:
          - not_null
      - name: augment_name
      - name: augment_description
      - name: augment_effects
      - name: augment_associated_trait
      - name: patch_version
        data_tests:
          - not_null
      - name: dbt_valid_from
        data_tests:
          - not_null
      - name: dbt_valid_to
        data_tests:
          - not_null
      - name: ingested_at
        data_tests:
          - not_null
      - name: loaded_at
        data_tests:
          - not_null

  - name: dim_18_augment_effects
    description: "Flattened numeric effects for each augment version."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - augment_version_sk
              - augment_effect_key
    columns:
      - name: augment_version_sk
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_18_augments')
                field: augment_version_sk
      - name: augment_sk
      - name: augment_id
      - name: augment_name
      - name: augment_description
      - name: augment_effect_key
        data_tests:
          - not_null
      - name: augment_effect_value
      - name: augment_associated_trait
      - name: patch_version
      - name: ingested_at
      - name: loaded_at
      - name: dbt_valid_from
      - name: dbt_valid_to

