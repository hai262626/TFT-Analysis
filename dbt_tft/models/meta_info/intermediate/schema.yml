version: 2

models:
  - name: int_18_augments
    description: "Normalized Set 18 augment metadata derived from staged items."
    columns:
      - name: augment_id
        data_tests:
          - not_null
          - unique
      - name: augment_name
      - name: augment_description
      - name: augment_effects
      - name: augment_associated_traits
      - name: ingested_at
      - name: loaded_at

  - name: int_18_equipments
    description: "Normalized equipment metadata with component identifiers and names."
    data_tests:
      - dbt_utils.expression_is_true:
          expression: "(equipment_name = 'CompleteItem' AND component_1 IS NOT NULL AND component_2 IS NOT NULL) OR equipment_name != 'CompleteItem'"
    columns:
      - name: equipment_id
        data_tests:
          - not_null
          - unique
      - name: equipment_name
      - name: item_category
      - name: component_1
      - name: component_1_name
      - name: component_2
      - name: component_2_name
      - name: ingested_at
      - name: loaded_at

  - name: int_18_traits
    description: "Relational projection of staged Set 18 traits."
    columns:
      - name: set_number
      - name: trait_id
        data_tests:
          - not_null
          - unique
      - name: trait_name
      - name: trait_description
      - name: ingested_at
      - name: loaded_at

  - name: int_18_traits_tiers
    description: "One row per trait tier, including a default tier for traits without configured effects."
    data_tests:
      # Most important test: Prevent grain breaks / duplicate rows after flattening activation thresholds
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - trait_id
            - tier_id
      - dbt_utils.expression_is_true:
          expression: "min_units <= max_units OR min_units IS NULL OR max_units IS NULL"
      - dbt_utils.expression_is_true:
          expression: "tier_level = 0 OR (min_units > 0 AND max_units > 0) OR min_units IS NULL OR max_units IS NULL"
      - dbt_utils.expression_is_true:
          expression: "max_units <= 25000 OR max_units IS NULL"
      - dbt_utils.expression_is_true:
          expression: "(tier_level = 0 AND tier_variables IS NULL) OR (tier_level > 0 AND tier_variables IS NOT NULL) OR tier_level IS NULL"
    columns:
      - name: trait_id
        data_tests:
          - not_null
          - relationships:
              to: ref('int_18_traits')
              field: trait_id
      - name: tier_id
        data_tests:
          - not_null
      - name: tier_level
      - name: min_units
        data_tests:
          - not_null:
              config:
                severity: warn 
                warn_if: "> 0"
                error_if: ">= 10"
      - name: max_units
        data_tests:
          - not_null:
              config:
                severity: warn 
                warn_if: "> 0"
                error_if: ">= 10"
      - name: style
      - name: tier_variables
      - name: ingested_at
      - name: loaded_at

  - name: int_18_wands
    description: "Normalized Set 18 wand metadata with resolved effect values."
    columns:
      - name: wand_id
        data_tests:
          - not_null
          - unique
      - name: wand_name
      - name: wand_description
      - name: wand_effects
        data_tests:
          - not_null  # Must be kept: Verify that the Python UDF does not return a null object
      - name: ingested_at
      - name: loaded_at